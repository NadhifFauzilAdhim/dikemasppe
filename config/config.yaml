# ============================================
# PPE Detection System - Configuration
# ============================================
# Override default settings here.
# Only include settings you want to change.

model:
  weights_path: "yolomodel/best4.pt"
  input_size: 640
  confidence_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 100
  device: "auto"            # "auto", "cpu", "cuda", "cuda:0"
  half_precision: false      # Set true for FP16 (GPU only)

video:
  source: "9"               # "0" = webcam, or path/URL
  frame_width: 1280
  frame_height: 720
  fps: 30
  buffer_size: 1
  save_output: false
  output_path: "outputs/output.mp4"

visualization:
  show_confidence: true
  show_labels: true
  show_fps: true
  show_count: true
  bbox_thickness: 2
  font_scale: 0.6

detection:
  min_bbox_area: 500
  target_classes: null       # null = all classes, or [0, 1, 3]
  enable_tracking: false
  tracker_type: "bytetrack"

logging:
  level: "INFO"
  log_to_file: false
  log_detections: true

api:
  enabled: true               
  base_url: "http://localhost:8000"
  endpoint: "/api/v1/violations"
  api_key: "1|C4oFU5VH0vN26vQp37MUDKx7DOJmXXN74HjfQ38U54ce4e4b"                   # Bearer token (optional)
  camera_id: "CAM-001"          # Identifier for this camera
  timeout: 10                   # Request timeout (seconds)
  max_retries: 3                # Retry on failure
  cooldown_seconds: 30          # Min seconds between same violation uploads
  save_local: true              # Save violation captures locally
  capture_dir: "outputs/violations"
  max_saved_images: 5        # Max locally saved images (auto-delete oldest)
  # Image compression (reduces upload size significantly)
  jpeg_quality: 60              # JPEG quality 1-100 (lower = smaller file, 60 recommended)
  max_image_width: 800          # Max pixel width (0 = no resize)
  max_image_height: 600         # Max pixel height (0 = no resize)

# PPE Class Names
# class_names:
#   0: "Gloves"
#   1: "Vest"
#   2: "Goggles"
#   3: "Helmet"
#   4: "Mask"
#   5: "Safety Shoe"

class_names:
  0: "Hardhat"
  1: "Mask"
  2: "NO-Hardhat"
  3: "NO-Mask"
  4: "NO-Safety Vest"
  5: "Person"
  6: "Safety Cone"
  7: "Safety Vest"
  8: "machinery"
  9: "vehicle"
